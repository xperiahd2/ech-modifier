<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECH modifier</title>
<script>
(function () {
  var th = "";
  try { th = localStorage.getItem("echTheme") || ""; } catch (e) {}
  if (th !== "dark" && th !== "light") {
    th = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", th);
})();
</script>
<style>
  :root { color-scheme: light; --bg:#f3f6f4; --fg:#1c2321; --muted:#52605a; --accent:#0f6b5c; --accent-fg:#0f6b5c; --on-accent:#fff;
          --field-bg:#fff; --field-bd:#b7c4be; --card-bg:#fff; --card-bd:#c9d3ce; --rep-bd:#dfe6e2; --status:#444; --warn:#9a5b00; }
  :root[data-theme="dark"] { color-scheme: dark; --bg:#121212; --fg:#e6e6e6; --muted:#a3a3a3; --accent:#1f8f7c; --accent-fg:#5fd3bd; --on-accent:#fff;
          --field-bg:#1e1e1e; --field-bd:#3d3d3d; --card-bg:#1e1e1e; --card-bd:#333; --rep-bd:#2b2b2b; --status:#bdbdbd; --warn:#e0a24a; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.6 sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 12px; color: var(--muted); }
  .tools { display: flex; flex: none; gap: 8px; align-items: stretch; }
  #theme { margin: 0; padding: 6px 12px; border: 1px solid var(--accent-fg); border-radius: 6px; background: var(--field-bg); color: var(--accent-fg); font: 14px sans-serif; white-space: nowrap; }
  .langs { display: flex; flex: none; border: 1px solid var(--accent-fg); border-radius: 6px; overflow: hidden; }
  .langs button { margin: 0; padding: 6px 12px; border: 0; border-radius: 0; background: var(--field-bg); color: var(--accent-fg); font: 14px sans-serif; }
  .langs button.on { background: var(--accent); color: var(--on-accent); }
  label { display: block; font-weight: bold; margin: 14px 0 6px; }
  textarea, input[type=text], select { direction: ltr; text-align: left; width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--field-bd); border-radius: 6px; background: var(--field-bg); color: var(--fg); font: 14px monospace; }
  textarea { height: 150px; word-break: break-all; }
  .opt { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; }
  .opt input { width: 18px; height: 18px; margin-top: 4px; flex: none; }
  .opt label { margin: 0; font-weight: normal; }
  .chips label { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0; margin-inline-end: 14px; font-weight: normal; direction: ltr; }
  .chips input { width: 18px; height: 18px; }
  .packchips label { display: flex; align-items: center; gap: 8px; margin: 6px 0; font: 13px monospace; font-weight: normal; direction: ltr; word-break: break-all; }
  .packchips input { width: 18px; height: 18px; flex: none; }
  .hint { margin: 0; color: var(--muted); font-size: 14px; }
  .actions button, .card button { margin: 12px 0 0; margin-inline-end: 8px; padding: 10px 16px; border: 0; border-radius: 6px; background: var(--accent); color: var(--on-accent); font: bold 16px sans-serif; }
  .actions button.alt, .card button { background: var(--field-bg); color: var(--accent-fg); border: 1px solid var(--accent-fg); }
  .actions label.filebtn { display: inline-block; margin: 12px 0 0; margin-inline-end: 8px; padding: 10px 16px; border: 1px solid var(--accent-fg); border-radius: 6px; background: var(--field-bg); color: var(--accent-fg); font: bold 16px sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .fileraw { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; opacity: 0; overflow: hidden; }
  .card { margin-top: 10px; padding: 10px 12px; background: var(--card-bg); border: 1px solid var(--card-bd); border-radius: 6px; }
  .card .name { word-break: break-word; }
  .card button { margin-top: 8px; padding: 6px 14px; font-size: 14px; }
  .qr { margin-top: 10px; text-align: center; }
  .qr svg { width: 100%; max-width: 360px; height: auto; background: #fff; padding: 4px; box-sizing: border-box; }
  #reportBox { margin-top: 8px; }
  #reportBox summary { cursor: pointer; color: var(--accent-fg); font-weight: bold; }
  .rep { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--rep-bd); font-size: 14px; }
  .repname { flex: 1; word-break: break-word; }
  .repok { color: var(--accent-fg); flex: none; }
  .repwarn { color: var(--warn); flex: none; text-align: end; }
  #status { margin-top: 10px; color: var(--status); min-height: 1.6em; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1 data-i="title">ECH modifier</h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="tools">
      <button type="button" id="theme"></button>
      <div class="langs">
        <button type="button" id="langFa">فارسی</button>
        <button type="button" id="langEn">English</button>
      </div>
    </div>
  </div>

  <label for="profile" data-i="lblProfile"></label>
  <select id="profile">
    <option value="custom" data-i="prof_custom"></option>
    <option value="mci_ech" data-i="prof_mci_ech"></option>
    <option value="mci_v6" data-i="prof_mci_v6"></option>
    <option value="mci_v6ff" data-i="prof_mci_v6ff"></option>
    <option value="irancell_ff" data-i="prof_irancell_ff"></option>
  </select>
  <p class="hint" data-i="profileHint"></p>

  <div class="opt">
    <input type="checkbox" id="ffMode">
    <label for="ffMode" data-i="ffMode"></label>
  </div>
  <p class="hint" data-i="ffHint"></p>

  <div class="opt">
    <input type="checkbox" id="useEch" checked>
    <label for="useEch" data-i="useEch"></label>
  </div>
  <p class="hint" data-i="echExclusive"></p>
  <div id="echBox">
    <label for="echPreset" data-i="lblEch"></label>
    <select id="echPreset">
      <option value="cloudflare-ech.com+udp://1.1.1.1">cloudflare-ech.com+udp://1.1.1.1</option>
      <option value="crypto.cloudflare.com+udp://1.1.1.1">crypto.cloudflare.com+udp://1.1.1.1</option>
      <option value="cloudflare-ech.com+udp://1.0.0.1">cloudflare-ech.com+udp://1.0.0.1</option>
      <option value="cloudflare-ech.com+udp://8.8.8.8">cloudflare-ech.com+udp://8.8.8.8</option>
      <option value="cloudflare-ech.com+https://1.1.1.1/dns-query">cloudflare-ech.com+https://1.1.1.1/dns-query</option>
      <option value="cloudflare-ech.com+https://8.8.8.8/dns-query">cloudflare-ech.com+https://8.8.8.8/dns-query</option>
      <option value="__custom__" data-i="echCustom"></option>
    </select>
    <input type="text" id="ech" value="cloudflare-ech.com+udp://1.1.1.1" spellcheck="false" aria-label="ECH" data-ph="echPlaceholder" style="margin-top:8px;display:none">
  </div>

  <label for="fp" data-i="lblFp"></label>
  <select id="fp">
    <option>chrome</option><option>firefox</option><option>safari</option><option>ios</option>
    <option>android</option><option>edge</option><option>360</option><option>qq</option>
    <option>random</option><option>randomized</option><option>unsafe</option>
  </select>

  <label for="fmSel" data-i="lblFm"></label>
  <select id="fmSel">
    <option value="none" data-i="optNone"></option>
    <option value="tlshello">tlshello-0-len</option>
    <option value="custom" data-i="echCustom"></option>
  </select>
  <textarea id="fmText" spellcheck="false" style="height:110px;margin-top:8px;display:none"></textarea>

  <label for="csSel" data-i="lblCs"></label>
  <select id="csSel">
    <option value="none" data-i="optNone"></option>
    <option value="semipython">semi-python</option>
    <option value="full" data-i="csFull"></option>
    <option value="custom" data-i="echCustom"></option>
  </select>
  <textarea id="csText" spellcheck="false" style="height:90px;margin-top:8px;display:none"></textarea>

  <div class="opt">
    <input type="checkbox" id="addrOn">
    <label for="addrOn" data-i="addrOn"></label>
  </div>
  <div id="addrBox" style="display:none">
    <div id="addrFamBox">
      <label for="addrFam" data-i="lblAddrFam"></label>
      <select id="addrFam" style="margin-bottom:8px">
        <option value="any" data-i="famAny"></option>
        <option value="v4" data-i="famV4"></option>
        <option value="v6" data-i="famV6"></option>
      </select>
    </div>
    <label for="addrText" data-i="lblClean"></label>
    <textarea id="addrText" spellcheck="false" style="height:90px" placeholder="188.114.97.6&#10;2a06:98c1:3121::7"></textarea>
    <p class="hint" data-i="addrHint"></p>
    <p class="hint" data-i="famRule"></p>
  </div>

  <div class="opt">
    <input type="checkbox" id="alpnAuto">
    <label for="alpnAuto" data-i="alpnAuto"></label>
  </div>

  <div class="opt">
    <input type="checkbox" id="convert" checked>
    <label for="convert" data-i="convert"></label>
  </div>

  <div class="opt">
    <input type="checkbox" id="packMode">
    <label for="packMode" data-i="packMode"></label>
  </div>
  <div id="packBox" style="display:none">
    <select id="packType">
      <option value="profile" data-i="packByProfile"></option>
      <option value="ech" data-i="packByEch"></option>
    </select>
    <div class="packchips" id="profChips"></div>
    <div class="packchips" id="packChips" style="display:none"></div>
    <p class="hint" data-i="packHint"></p>
  </div>

  <label data-i="lblPorts"></label>
  <div class="chips">
    <label><input type="checkbox" name="port" value="443" checked>443</label>
    <label><input type="checkbox" name="port" value="2053">2053</label>
    <label><input type="checkbox" name="port" value="2083">2083</label>
    <label><input type="checkbox" name="port" value="2087">2087</label>
    <label><input type="checkbox" name="port" value="2096">2096</label>
    <label><input type="checkbox" name="port" value="8443">8443</label>
  </div>
  <p class="hint" data-i="portsHint"></p>
  <div class="opt">
    <input type="checkbox" id="portsAll" checked>
    <label for="portsAll" data-i="portsAll"></label>
  </div>

  <label for="input" data-i="lblIn"></label>
  <textarea id="input" spellcheck="false"></textarea>

  <div class="actions">
    <button type="button" id="run" data-i="run"></button>
    <button type="button" id="paste" class="alt" data-i="paste"></button>
    <label for="fileIn" id="openFile" class="filebtn" data-i="openFile"></label>
    <input type="file" id="fileIn" class="fileraw">
    <button type="button" id="clear" class="alt" data-i="clear"></button>
  </div>
  <p class="hint" data-i="fileHint"></p>
  <div class="actions" id="blockedBox" style="display:none"><button type="button" id="openSub" class="alt" data-i="openSub"></button></div>
  <div id="status" role="status"></div>
  <details id="reportBox" style="display:none">
    <summary data-i="lblReport"></summary>
    <div id="report"></div>
  </details>

  <label for="output" data-i="lblOut"></label>
  <textarea id="output" readonly spellcheck="false"></textarea>
  <div class="actions">
    <button type="button" id="copy" class="alt" data-i="copy"></button>
    <button type="button" id="copy64" class="alt" data-i="copy64"></button>
    <button type="button" id="dlJson" class="alt" data-i="dlJson"></button>
    <button type="button" id="copyJson" class="alt" data-i="copyJson"></button>
  </div>
  <p class="hint" data-i="jsonHintIos"></p>

  <div id="cardsBox" style="display:none">
    <label data-i="lblCards"></label>
    <div id="cards"></div>
  </div>
  <p class="hint" style="margin-top:28px;text-align:center;direction:ltr">ECH modifier v25</p>
</main>

// walks the text line by line; plain links are kept, Base64 blobs are decoded (up to MAX_B64_DEPTH layers).

function extractItems(text, depth) {
  var items = [];
  var lines = text.split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var l = trim(lines[i]);

      items.push({ kind: /^https?:\/\//i.test(l) ? "unknown" : "link", text: l });
      continue;
    }
    if (!/^[A-Za-z0-9+\/_\-]{16,}={0,2}$/.test(l)) { items.push({ kind: "unknown", text: l }); continue; }
    if (depth >= MAX_B64_DEPTH) { items.push({ kind: "deep", text: l }); continue; }

function buildPackChips() {

function syncPreset() {
  var sel = $("echPreset"), v = trim($("ech").value), found = "__custom__";
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === v) { found = v; }
  }
  sel.value = found;
  $("ech").style.display = (found === "__custom__") ? "block" : "none";
}

var FIELD_IDS = ["profile", "useEch", "echPreset", "ech", "fp", "fmSel", "fmText", "csSel", "csText", "addrOn", "addrFam", "addrText", "alpnAuto"];
function updateUi() {
  var pack = $("packMode").checked, pt = $("packType").value, byProf = pack && pt === "profile", byEch = pack && pt === "ech", i;
  for (i = 0; i < FIELD_IDS.length; i++) { $(FIELD_IDS[i]).disabled = false; }
  if (byProf) { for (i = 0; i < FIELD_IDS.length; i++) { $(FIELD_IDS[i]).disabled = true; } $("addrText").disabled = false; }
  if (byEch) { $("useEch").disabled = true; $("echPreset").disabled = true; $("ech").disabled = true; }
  if (!byProf && (byEch || $("useEch").checked)) {
    // ECH is never combined with the F&F fields: they are cleared and locked while ECH is on
    $("fmSel").value = "none"; $("csSel").value = "none";
    $("fmSel").disabled = true; $("csSel").disabled = true;
  }
  $("packBox").style.display = pack ? "block" : "none";
  $("packChips").style.display = byEch ? "block" : "none";
  $("profChips").style.display = byProf ? "block" : "none";
  $("echBox").style.display = ($("useEch").checked && !pack) ? "block" : "none";
  $("fmText").style.display = $("fmSel").value === "custom" ? "block" : "none";
  $("csText").style.display = $("csSel").value === "custom" ? "block" : "none";
  $("addrBox").style.display = ($("addrOn").checked || byProf) ? "block" : "none";
  $("addrFamBox").style.display = byProf ? "none" : "block";
  // ECH and the unsafe fingerprint never go together (ECH wants chrome)
  if (!byProf && (byEch || $("useEch").checked) && $("fp").value === "unsafe") { $("fp").value = "chrome"; }
  var ffFields = $("fmSel").value !== "none" || $("csSel").value !== "none";
  var ff = !byProf && !byEch && !$("useEch").checked && ffFields && $("fp").value === "unsafe";
  $("ffMode").checked = ff;
  $("ffMode").disabled = byProf || byEch;
  if (ff) { $("fp").disabled = true; }
  // the ALPN fix only matters for F&F
  if (!byProf) {
    var alpnOk = !byEch && !$("useEch").checked && ffFields;
    if (!alpnOk) { $("alpnAuto").checked = false; }
    $("alpnAuto").disabled = !alpnOk;
  }
  var runKey = pack ? "runPack" : "run";
  $("run").setAttribute("data-i", runKey);
  $("run").textContent = t(runKey);
}

function applyProfile(id) {
  var p = profileById(id);
  if (!p) { return; }
  $("useEch").checked = p.useEch;
  if (p.ech) { $("ech").value = p.ech; }
  $("fp").value = p.fp;
  $("fmSel").value = p.fm;
  $("csSel").value = p.cs;
  $("addrOn").checked = p.addrOn;
  $("addrFam").value = p.fam || "any";
  if (!trim($("addrText").value)) { $("addrText").value = DEFAULT_ADDRS; }
  $("alpnAuto").checked = p.alpnAuto;
  syncPreset();
  updateUi();
}

function sameJson(a, b) {
  try { return JSON.stringify(JSON.parse(a)) === JSON.stringify(JSON.parse(b)); } catch (e) { return false; }
}

function loadSettings() {
  $("fmText").value = DEFAULT_FM;
  $("csText").value = DEFAULT_CS;
  $("addrText").value = DEFAULT_ADDRS;
  var s = null;
  try { s = JSON.parse(localStorage.getItem("echSettings") || "null"); } catch (e) {}
  if (!s) { syncPreset(); updateUi(); return; }
  if (typeof s.ech === "string" && s.ech) { $("ech").value = s.ech; }
  if (typeof s.fp === "string") { $("fp").value = s.fp; }
  if (typeof s.convert === "boolean") { $("convert").checked = s.convert; }
  if (typeof s.portsAll === "boolean") { $("portsAll").checked = s.portsAll; }
  if (typeof s.pack === "boolean") { $("packMode").checked = s.pack; }
  if (s.ports && s.ports.length !== undefined) {
    var els = document.querySelectorAll("input[name=port]");
    for (var i = 0; i < els.length; i++) { els[i].checked = s.ports.indexOf(els[i].value) !== -1; }
  }
  if (s.packList && s.packList.length !== undefined) {
    var pk = document.querySelectorAll("input[name=packEch]");
    for (var q = 0; q < pk.length; q++) { pk[q].checked = s.packList.indexOf(pk[q].value) !== -1; }
  }
  if (s.v === 2) {
    if (typeof s.useEch === "boolean") { $("useEch").checked = s.useEch; }
    if (typeof s.fmText === "string" && s.fmText) { $("fmText").value = s.fmText; }
    if (typeof s.csText === "string" && s.csText) { $("csText").value = s.csText; }
    if (s.fmSel) { $("fmSel").value = s.fmSel; }
    if (s.csSel) { $("csSel").value = s.csSel; }
    if (typeof s.addrOn === "boolean") { $("addrOn").checked = s.addrOn; }
    if (s.addrFam) { $("addrFam").value = s.addrFam; }
    if (typeof s.addrText === "string") { $("addrText").value = s.addrText; }
    var at = trim($("addrText").value);
    if (at === "188.114.97.6" || at === "2a06:98c1:3121::7") { $("addrText").value = DEFAULT_ADDRS; }   // older builds saved one example per preset
    if (typeof s.alpnAuto === "boolean") { $("alpnAuto").checked = s.alpnAuto; }
    if (s.packType) { $("packType").value = s.packType; }
    if (s.profList && s.profList.length !== undefined) {
      var pf = document.querySelectorAll("input[name=packProf]");
      for (var r = 0; r < pf.length; r++) { pf[r].checked = s.profList.indexOf(pf[r].value) !== -1; }
    }
    if (s.profile && (s.profile === "custom" || profileById(s.profile))) { $("profile").value = s.profile; }
  } else {
    // settings saved by the older version: "fragment mode" becomes its own fields
    $("packType").value = "ech";
    if (s.mask === true) {
      $("useEch").checked = false;
      $("fp").value = "unsafe";
      if (typeof s.fm === "string" && s.fm) {
        $("fmText").value = s.fm;
        $("fmSel").value = sameJson(s.fm, FM_TLSHELLO) ? "tlshello" : "custom";
      }
      if (typeof s.cs === "string" && s.cs) {
        $("csText").value = s.cs;
        $("csSel").value = s.cs === DEFAULT_CS ? "full" : "custom";
      }
    } else {
      if (typeof s.fm === "string" && s.fm) { $("fmText").value = s.fm; }
      if (typeof s.cs === "string" && s.cs) { $("csText").value = s.cs; }
    }
  }
  syncPreset();
  updateUi();
}

function readSettings() {

           cs: $("csSel").value, csText: $("csText").value, addrOn: $("addrOn").checked, addrFam: $("addrFam").value, addrText: $("addrText").value, alpnAuto: $("alpnAuto").checked };
}
function profileSettings(p) {
  return { useEch: p.useEch, ech: p.ech || trim($("ech").value), fp: p.fp, fm: p.fm, fmText: $("fmText").value,
           cs: p.cs, csText: $("csText").value, addrOn: p.addrOn, addrFam: p.fam || "any", addrText: $("addrText").value, alpnAuto: p.alpnAuto };
}
// settings -> options for addEch, or { err: key }
function buildOpts(st) {
  var fm = "", cs = "";
  if (st.useEch) { st = Object.assign({}, st, { fm: "none", cs: "none", alpnAuto: false, fp: st.fp === "unsafe" ? "chrome" : st.fp }); }   // ECH and F&F are never used together
  if (st.fm === "tlshello") { fm = safeEnc(JSON.stringify(JSON.parse(FM_TLSHELLO))); }
  else if (st.fm === "custom") {
    try { fm = safeEnc(JSON.stringify(JSON.parse(st.fmText))); } catch (e) { return { err: "badFm" }; }
  }
  if (st.cs === "semipython") { cs = safeEnc(CS_SEMIPYTHON.replace(/\s+/g, "")); }
  else if (st.cs === "full") { cs = safeEnc(DEFAULT_CS.replace(/\s+/g, "")); }
  else if (st.cs === "custom") { cs = safeEnc(st.csText.replace(/\s+/g, "")); }
  if (st.useEch && !st.ech) { return { err: "emptyEch" }; }
  var a = parseAddrList(st.addrOn ? st.addrText : "", st.addrFam);
  if (st.addrOn && !a.list.length) { return { err: "noAddr" }; }
  return {
    opts: { ech: st.useEch ? st.ech : "", fp: st.fp, fm: fm, cs: cs, addrs: a.list, alpnAuto: !!st.alpnAuto && (fm !== "" || cs !== ""),
            convert: $("convert").checked, ports: portList(), portsAll: $("portsAll").checked },
    badAddr: a.bad, otherAddr: a.other
  };
}

function applyLang(l) {
  LANG = l;

  document.title = t("title");
  $("langFa").className = (l === "fa") ? "on" : "";
  $("langEn").className = (l === "en") ? "on" : "";
  try { localStorage.setItem("echLang", l); } catch (e) {}
  var btns = document.querySelectorAll("[data-card]");
  for (var j = 0; j < btns.length; j++) {

  renderReport();
  renderStatus();
  updateThemeBtn();

function copyText(text, done) {
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else {
    fallback();
  }
}

// ---- result cards with QR ----

// ---- main flow ----
var lastReport = [];

function rowName(link) {

    try { var nm = decodeURIComponent(link.substring(h + 1)); if (nm) { return nm; } } catch (e) {}
  }

  return s.length > 44 ? s.substring(0, 44) + "..." : s;

function processText(text) {
  saveSettings();
  var variants = [], badAddr = 0, otherAddr = 0, skipProf = [], b, v, pack = $("packMode").checked, ptype = $("packType").value;
  if (pack && ptype === "profile") {
    var ids = profList();
    if (!ids.length) { say("packEmpty"); return; }
    for (v = 0; v < ids.length; v++) {
      var pf = profileById(ids[v]);
      b = buildOpts(profileSettings(pf));
      if (b.err === "noAddr") { skipProf.push(pf.tag); continue; }   // nothing in the list for this preset's type
      if (b.err) { say(b.err); return; }
      badAddr = b.badAddr;   // the same list is read for every preset
      variants.push({ opts: b.opts, tag: pf.tag });
    }
    if (!variants.length) { say("noAddr"); return; }
  } else if (pack) {
    var evs = packList();
    if (!evs.length) { say("packEmpty"); return; }
    for (v = 0; v < evs.length; v++) {
      var st2 = readSettings();
      st2.useEch = true;
      st2.fm = "none";
      st2.cs = "none";
      st2.ech = evs[v];
      b = buildOpts(st2);
      if (b.err) { say(b.err); return; }
      badAddr = b.badAddr;
      variants.push({ opts: b.opts, tag: echLabel(evs[v]) });
    }
  } else {
    b = buildOpts(readSettings());
    if (b.err) { say(b.err); return; }
    badAddr = b.badAddr;
    otherAddr = b.otherAddr;
    variants.push({ opts: b.opts, tag: "" });
  }

  var jl = jsonToLinks(text), jsonSkipped = [];
  if (jl) {
    if (jl.bad) { say("badJson"); return; }
    if (!jl.links.length && !jl.skipped.length) { say("jsonNoConfigs"); return; }
    jsonSkipped = jl.skipped;
    text = jl.links.join("\n");
  }
  var items = extractItems(text, 0);
  for (var js = 0; js < jsonSkipped.length; js++) { items.push({ kind: "protocol", text: jsonSkipped[js] }); }
  var c = { total: 0, enh: 0, out: 0, dup: 0, badAddr: badAddr, otherAddr: otherAddr, skipProf: skipProf, enhanced: 0, converted: 0, notls: 0, noports: 0, noname: 0, noip: 0, echDropped: 0, othersec: 0,
            protocol: 0, invalid: 0, incomplete: 0, unknown: 0, badb64: 0, deep: 0 };
  var out = [], seen = Object.create(null), rows = [], i, j;
  for (i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.kind === "link") {
      c.total++;
      var best = null, made = [], rr, k2;
      for (v = 0; v < variants.length; v++) {
        rr = addEch(it.text, variants[v].opts);
        c.echDropped += rr.echDropped || 0;
        if (best === null || (best.texts.length === 0 && rr.texts.length > 0)) { best = rr; }
        for (k2 = 0; k2 < rr.texts.length; k2++) {
          made.push(variants.length > 1 ? appendTag(rr.texts[k2], variants[v].tag) : rr.texts[k2]);
        }
      }
      c[best.state]++;
      rows.push({ name: rowName(it.text), state: best.state });
      for (j = 0; j < made.length; j++) {
        if (seen[made[j]]) { c.dup++; }
        else { seen[made[j]] = true; out.push(made[j]); }   // first occurrence keeps its place
      }
    } else {
      c[it.kind]++;
      rows.push({ name: shorten(it.text), state: it.kind });
    }
  }
  c.enh = c.enhanced + c.converted;
  c.out = out.length;
  lastReport = rows;
  renderReport();
  if (out.length > 400) {
    $("output").value = "";
    renderCards([]);
    var tooMany = out.length;
    setStatus(function () { return t("tooMany").replace("{n}", tooMany); });
    return;
  }

  $("output").value = out.join("\n");
  renderCards(out);

  if (!c.total) {
    if (c.badb64) { say("badB64Only"); }
    else { say("nothingFound"); }
    return;
  }
  setStatus(function () { return t("sum")(c); });
}

// ---- Xray JSON input -> links ----
function qpair(parts, k, v) {
  if (v === undefined || v === null || v === "") { return; }
  parts.push(k + "=" + safeEnc(String(v)));
}

// one Xray outbound -> vless/trojan link, or null
function xrayToLink(ob, remarks) {
  if (!ob || typeof ob !== "object") { return null; }
  var proto = String(ob.protocol || "").toLowerCase();
  if (proto !== "vless" && proto !== "trojan") { return null; }
  var st = ob.settings || {}, host, port, id, flow = "", enc = "none", srv;
  if (proto === "vless") {
    var vn = st.vnext && st.vnext[0], us = vn && vn.users && vn.users[0];
    if (vn && us) { host = vn.address; port = vn.port; id = us.id; flow = us.flow || ""; enc = us.encryption || "none"; }
    else if (st.address) { host = st.address; port = st.port; id = st.id; flow = st.flow || ""; enc = st.encryption || "none"; }
  } else {
    srv = st.servers && st.servers[0];
    if (srv) { host = srv.address; port = srv.port; id = srv.password; }
    else if (st.address) { host = st.address; port = st.port; id = st.password; }
  }
  if (!host || !port || !id) { return null; }

  var ss = ob.streamSettings || {};
  var net = String(ss.network || "tcp").toLowerCase();
  var sec = String(ss.security || "none").toLowerCase();
  var q = [];
  if (proto === "vless") { qpair(q, "encryption", enc); qpair(q, "flow", flow); }
  qpair(q, "security", sec);
  qpair(q, "type", net === "http" ? "h2" : net);

  var pth = "", hst = "", x;
  if (net === "ws" && ss.wsSettings) {
    pth = ss.wsSettings.path || "";
    hst = (ss.wsSettings.headers && (ss.wsSettings.headers.Host || ss.wsSettings.headers.host)) || ss.wsSettings.host || "";
  } else if (net === "httpupgrade" && ss.httpupgradeSettings) {
    pth = ss.httpupgradeSettings.path || ""; hst = ss.httpupgradeSettings.host || "";
  } else if (net === "xhttp" || net === "splithttp") {
    x = ss.xhttpSettings || ss.splithttpSettings || {};
    pth = x.path || ""; hst = x.host || "";
    qpair(q, "mode", x.mode);
    if (x.extra && typeof x.extra === "object") { qpair(q, "extra", JSON.stringify(x.extra)); }
  } else if (net === "grpc" && ss.grpcSettings) {
    x = ss.grpcSettings;
    qpair(q, "serviceName", x.serviceName);
    qpair(q, "mode", x.multiMode ? "multi" : "gun");
    qpair(q, "authority", x.authority);
  } else if ((net === "h2" || net === "http") && ss.httpSettings) {
    pth = ss.httpSettings.path || "";
    hst = ss.httpSettings.host || "";
  } else if ((net === "kcp" || net === "mkcp") && ss.kcpSettings) {
    qpair(q, "headerType", ss.kcpSettings.header && ss.kcpSettings.header.type);
    qpair(q, "seed", ss.kcpSettings.seed);
  } else if (net === "tcp" && ss.tcpSettings && ss.tcpSettings.header && ss.tcpSettings.header.type === "http") {
    var rq = ss.tcpSettings.header.request || {};
    qpair(q, "headerType", "http");
    pth = rq.path || "";
    hst = (rq.headers && (rq.headers.Host || rq.headers.host)) || "";
  }
  if (Array.isArray(pth)) { pth = pth.join(","); }
  if (Array.isArray(hst)) { hst = hst.join(","); }
  qpair(q, "path", pth);
  qpair(q, "host", hst);

  if (sec === "tls" && ss.tlsSettings) {
    x = ss.tlsSettings;
    qpair(q, "sni", x.serverName);
    qpair(q, "fp", x.fingerprint);
    if (x.alpn && x.alpn.length) { qpair(q, "alpn", x.alpn.join(",")); }
    if (x.allowInsecure) { qpair(q, "allowInsecure", "1"); }
  } else if (sec === "reality" && ss.realitySettings) {
    x = ss.realitySettings;
    qpair(q, "sni", x.serverName);
    qpair(q, "fp", x.fingerprint);
    qpair(q, "pbk", x.publicKey || x.password);
    qpair(q, "sid", x.shortId);
    qpair(q, "spx", x.spiderX);
  }

  var h = String(host);
  if (h.indexOf(":") !== -1 && h.charAt(0) !== "[") { h = "[" + h + "]"; }
  var name = remarks || ob.tag || (host + ":" + port);
  return proto + "://" + safeEnc(String(id)) + "@" + h + ":" + port + "?" + q.join("&") + "#" + safeEnc(String(name));
}

var NON_PROXY = { freedom: 1, blackhole: 1, dns: 1, loopback: 1, direct: 1, block: 1 };

// text -> null (not JSON) | { bad: true } | { links: [...], skipped: [names] }
function jsonToLinks(text) {
  var tt = trim(text);
  if (!/^[\[{]/.test(tt)) { return null; }
  var data;
  try { data = JSON.parse(tt); } catch (e) { return { bad: true, links: [], skipped: [] }; }
  var links = [], skipped = [];
  function outbound(ob, remarks) {
    var l = xrayToLink(ob, remarks);
    if (l) { links.push(l); return; }
    var pr = ob && String(ob.protocol || "").toLowerCase();
    if (pr && !NON_PROXY[pr]) { skipped.push((remarks || ob.tag || pr) + " (" + pr + ")"); }
  }
  function walk(node, depth) {
    var i;
    if (depth > 4 || !node) { return; }
    if (Array.isArray(node)) { for (i = 0; i < node.length; i++) { walk(node[i], depth + 1); } return; }
    if (typeof node !== "object") { return; }
    if (Array.isArray(node.outbounds)) {
      for (i = 0; i < node.outbounds.length; i++) { outbound(node.outbounds[i], node.remarks || node.ps || node.name || ""); }
    } else if (node.protocol) {
      outbound(node, node.remarks || node.ps || node.name || "");
    }
  }
  walk(data, 0);
  return { links: links, skipped: skipped };
}
// ---- end Xray JSON input ----

// ---- Xray JSON (full configs for iPhone apps that import Xray JSON) ----
// decodes every valid %XX run and leaves broken ones alone (decodeURIComponent alone throws on the whole string)
function safeDec(s) {
  try { return decodeURIComponent(s); } catch (e) {}
  return s.replace(/(?:%[0-9a-fA-F]{2})+/g, function (m) {
    try { return decodeURIComponent(m); } catch (e2) { return m; }
  });
}
function csv(v) {
  var a = v.split(","), r = [], i, x;
  for (i = 0; i < a.length; i++) { x = trim(a[i]); if (x) { r.push(x); } }
  return r;
}

function qparse(qs) {
  var o = Object.create(null), parts = qs.split("&"), i, tok, eq, k, v;
  for (i = 0; i < parts.length; i++) {
    tok = parts[i];
    if (!tok) { continue; }
    k = keyOf(tok);
    if (k in o) { continue; }
    eq = tok.indexOf("=");
    v = eq === -1 ? "" : tok.substring(eq + 1);
    o[k] = trim(safeDec(v));
  }
  return o;
}

// one vless/trojan link -> { name, outbound } or null
function linkToXray(link) {
  var main = link, name = "", hashAt = link.indexOf("#");
  if (hashAt !== -1) {
    main = link.substring(0, hashAt);
    name = safeDec(link.substring(hashAt + 1));
  }
  var qAt = main.indexOf("?");
  if (qAt === -1) { return null; }
  var p = parseBase(main.substring(0, qAt));
  if (!p) { return null; }
  if (!p.port) { p.port = "443"; }
  var scheme = p.scheme.toLowerCase();
  if (scheme !== "vless" && scheme !== "trojan") { return null; }
  var q = qparse(main.substring(qAt + 1));

  var user = safeDec(p.user);
  var host = p.host;
  if (host.charAt(0) === "[") { host = host.substring(1, host.length - 1); }
  var port = parseInt(p.port, 10);

  var ob = { tag: "proxy", protocol: scheme };
  if (scheme === "trojan") {
    ob.settings = { servers: [{ address: host, port: port, password: user }] };
  } else {
    var u = { id: user, encryption: q.encryption || "none" };
    if (q.flow) { u.flow = q.flow; }
    ob.settings = { vnext: [{ address: host, port: port, users: [u] }] };
  }

  var sec = (q.security || (scheme === "trojan" ? "tls" : "none")).toLowerCase();
  var net = (q.type || "tcp").toLowerCase();
  if (net === "splithttp") { net = "xhttp"; }
  var hostHdr = q.host || "", path = q.path || "";
  if (/^%2f/i.test(path)) { path = safeDec(path); }          // path that was encoded twice
  var ss = { network: net, security: sec };

  if (net === "ws") {
    ss.wsSettings = { path: path || "/" };
    if (hostHdr) { ss.wsSettings.headers = { Host: hostHdr }; }
  } else if (net === "grpc") {
    ss.grpcSettings = { serviceName: q.servicename || "", multiMode: q.mode === "multi" };
    if (q.authority) { ss.grpcSettings.authority = q.authority; }
  } else if (net === "httpupgrade") {
    ss.httpupgradeSettings = { path: path || "/" };
    if (hostHdr) { ss.httpupgradeSettings.host = hostHdr; }
  } else if (net === "xhttp") {
    var xs = { path: path || "/" };
    if (hostHdr) { xs.host = hostHdr; }
    if (q.mode) { xs.mode = q.mode; }
    if (q.extra) { try { xs.extra = JSON.parse(q.extra); } catch (e2) {} }
    ss.xhttpSettings = xs;
  } else if (net === "kcp" || net === "mkcp") {
    ss.network = "kcp";
    ss.kcpSettings = { header: { type: q.headertype || "none" } };
    if (q.seed) { ss.kcpSettings.seed = q.seed; }
  } else if (net === "h2" || net === "http") {
    ss.network = "h2";
    ss.httpSettings = { path: path || "/" };
    if (hostHdr) { ss.httpSettings.host = csv(hostHdr); }
  } else if (net === "tcp" && (q.headertype || "").toLowerCase() === "http") {
    ss.tcpSettings = { header: { type: "http", request: {
      path: path ? csv(path) : ["/"],
      headers: { Host: hostHdr ? csv(hostHdr) : [] }
    } } };
  }

  if (sec === "tls") {
    var tls = {};
    if (q.sni) { tls.serverName = q.sni; }
    if (q.fp) { tls.fingerprint = q.fp; }
    if (q.alpn) { var al = csv(q.alpn); if (al.length) { tls.alpn = al; } }
    if (q.allowinsecure === "1" || q.allowinsecure === "true" || q.insecure === "1") { tls.allowInsecure = true; }
    if (q.ech) { tls.echConfigList = /%(2B|3A|2F)/i.test(q.ech) ? safeDec(q.ech) : q.ech; }
    if (q.cs) { tls.cipherSuites = q.cs; }
    ss.tlsSettings = tls;
  }
  if (q.fm) { try { ss.finalmask = JSON.parse(q.fm); } catch (e3) {} }

  ob.streamSettings = ss;
  return { name: name || (host + ":" + port), outbound: ob };
}

function xrayConfig(link) {
  var r = linkToXray(link);
  if (!r) { return null; }
  var sniff = { enabled: true, destOverride: ["http", "tls", "quic"] };
  return {
    remarks: r.name,
    log: { loglevel: "warning" },
    inbounds: [
      { tag: "socks", listen: "127.0.0.1", port: 10808, protocol: "socks", settings: { auth: "noauth", udp: true }, sniffing: sniff },
      { tag: "http", listen: "127.0.0.1", port: 10809, protocol: "http", settings: {}, sniffing: sniff }
    ],
    outbounds: [
      r.outbound,
      { tag: "direct", protocol: "freedom", settings: {} },
      { tag: "block", protocol: "blackhole", settings: { response: { type: "http" } } }
    ],
    routing: { domainStrategy: "AsIs", rules: [] }

}

// lines of the result -> { text, count, skipped }
function buildJson(resultText) {
  var lines = resultText.split(/\r?\n/), arr = [], skipped = 0, i, l, cfg;
  for (i = 0; i < lines.length; i++) {
    l = trim(lines[i]);
    if (!l) { continue; }
    cfg = xrayConfig(l);
    if (cfg) { arr.push(cfg); } else { skipped++; }
  }
  return { text: JSON.stringify(arr, null, 2), count: arr.length, skipped: skipped };
}
// ---- end Xray JSON ----

function downloadText(filename, text) {
  var blob = new Blob([text], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

function process(text) {
  try { processText(text); }
  catch (e) {
    if (window.console && console.error) { console.error(e); }
    say("unexpected");
  }
}

var lastBlockedUrl = "";
function hideBlocked() { $("blockedBox").style.display = "none"; }
function failFetch(url) {
  lastBlockedUrl = url;
  $("blockedBox").style.display = "";
  say("blockedOpen");
}

function fetchSub(url) {
  say("fetching");
  var x = new XMLHttpRequest();
  try { x.open("GET", url, true); } catch (e) { failFetch(url); return; }
  x.timeout = 20000;
  x.onload = function () {
    if (x.status < 200 || x.status >= 300) {
      if (x.status === 0) { failFetch(url); return; }
      setStatus(function () { return t("serverErr").replace("{n}", x.status); });
      return;
    }
    var body = x.responseText;
    if (!body || !trim(body)) { say("emptyResp"); return; }
    process(body);
  };
  x.onerror = function () { failFetch(url); };
  x.ontimeout = function () { say("timeout"); };
  try { x.send(); } catch (e2) { failFetch(url); }
}

$("openSub").onclick = function () { if (lastBlockedUrl) { window.open(lastBlockedUrl, "_blank", "noopener"); } };

$("run").onclick = function () {
  hideBlocked();
  var text = trim($("input").value);
  if (!text) { say("pasteFirst"); return; }
  if (/^https?:\/\/\S+$/i.test(text)) { fetchSub(text); }
  else { process(text); }
};

});
$("input").addEventListener("paste", function () {
  if (!awaitPaste) { return; }
  setTimeout(function () {
    if (awaitPaste && trim($("input").value)) {
      awaitPaste = false;
      $("run").onclick();
    }
  }, 50);
});

$("paste").onclick = function () {
  if (navigator.clipboard && navigator.clipboard.readText) {
    navigator.clipboard.readText().then(function (txt) {
      if (!txt) { armPaste(); return; }
      awaitPaste = false;
      $("input").value = txt;
      $("run").onclick();
    }, function () { armPaste(); });
  } else {
    armPaste();
  }
};

$("fileIn").onchange = function () {
  var f = this.files && this.files[0], inp = this;
  if (!f) { return; }
  function got(txt) {
    awaitPaste = false;
    $("input").value = String(txt || "").replace(/^\uFEFF/, "");
    inp.value = "";
    $("run").onclick();
  }
  function fail() { inp.value = ""; say("fileErr"); }
  if (f.text) { f.text().then(got, fail); return; }
  var rd = new FileReader();
  rd.onload = function () { got(rd.result); };
  rd.onerror = fail;
  rd.readAsText(f);
};

$("clear").onclick = function () {
  awaitPaste = false;
  $("input").value = "";
  $("output").value = "";
  renderCards([]);
  lastReport = [];
  renderReport();
  setStatus(null);
  $("input").focus();
};

$("copy").onclick = function () {
  var v = $("output").value;
  if (!v) { say("nothingCopy"); return; }
  copyText(v, function () { say("copied"); });
};
$("copy64").onclick = function () {
  var v = $("output").value;
  if (!v) { say("nothingCopy"); return; }
  copyText(b64encodeUtf8(v), function () { say("copied64"); });
};

$("dlJson").onclick = function () {
  var v = $("output").value;
  if (!v) { say("nothingCopy"); return; }
  var r = buildJson(v);
  if (!r.count) { say("jsonNone"); return; }
  downloadText("ech-modifier-ios.json", r.text);
  setStatus(function () { return t("jsonDone")(r.count, r.skipped); });
};
$("copyJson").onclick = function () {
  var v = $("output").value;
  if (!v) { say("nothingCopy"); return; }
  var r = buildJson(v);
  if (!r.count) { say("jsonNone"); return; }
  copyText(r.text, function () { setStatus(function () { return t("jsonCopied")(r.count, r.skipped); }); });
};

$("theme").onclick = function () { setTheme(currentTheme() === "dark" ? "light" : "dark"); };

$("langFa").onclick = function () { applyLang("fa"); };
$("langEn").onclick = function () { applyLang("en"); };

buildPackChips();   // before the change handlers below, so the new checkboxes get them too

function markCustom() { if ($("profile").value !== "custom") { $("profile").value = "custom"; } }
var plain = document.querySelectorAll("#convert, #portsAll, input[name=port], input[name=packEch], input[name=packProf]");
for (var k = 0; k < plain.length; k++) { plain[k].onchange = saveSettings; }
var manual = ["useEch", "ech", "fp", "fmSel", "fmText", "csSel", "csText", "addrOn", "addrFam", "alpnAuto"];
manual.forEach(function (id) {
  $(id).addEventListener("change", function () { markCustom(); updateUi(); saveSettings(); });
});
$("ffMode").addEventListener("change", function () {
  if (this.checked) {
    $("useEch").checked = false;
    $("fp").value = "unsafe";
    if ($("fmSel").value === "none") { $("fmSel").value = "tlshello"; }
    if ($("csSel").value === "none") { $("csSel").value = "full"; }
  } else {
    $("fmSel").value = "none";
    $("csSel").value = "none";
    if ($("fp").value === "unsafe") { $("fp").value = "chrome"; }
    $("useEch").checked = true;
  }
  markCustom(); updateUi(); saveSettings();
});
$("addrText").addEventListener("change", saveSettings);   // the list is shared by every preset
$("profile").onchange = function () {
  if (this.value !== "custom") { applyProfile(this.value); }
  saveSettings();
};
$("packMode").onchange = function () { updateUi(); saveSettings(); };
$("packType").onchange = function () { updateUi(); saveSettings(); };
$("echPreset").onchange = function () {
  if (this.value === "__custom__") {
    $("ech").value = "";
    $("ech").style.display = "block";
    $("ech").focus();
  } else {
    $("ech").value = this.value;
    $("ech").style.display = "none";
  }
  markCustom();
  saveSettings();
};

loadSettings();
var saved = "";
try { saved = localStorage.getItem("echLang") || ""; } catch (e) {}
if (saved !== "fa" && saved !== "en") {
  saved = /^fa/i.test(navigator.language || "") ? "fa" : "en";
}
applyLang(saved);
</script>
</body>
</html>
